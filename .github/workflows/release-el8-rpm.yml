# Build unsigned Rocky 8 perl-NYTProfM RPM on v* tags (test-drive download).
# Host checkout + docker rockylinux:8 (same path as
# scripts/packaging/build_el8_module_rpm.sh). Do not use container: rockylinux:8
# with actions/checkout — Node/git are not in that image.
# %build stays cargo-free; nytprof-cli is the staged EL8 prebuilt.
# Not COPR / not rpmsign / not CI-mock certified.
name: Release EL8 RPM (test-drive)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-el8-rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  el8-rpm:
    name: rpmbuild (rockylinux:8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: rpmbuild perl-NYTProfM
        run: |
          set -euo pipefail
          chmod +x scripts/packaging/build_el8_module_rpm.sh \
            scripts/packaging/make_nytprofm_dist.sh
          ./scripts/packaging/build_el8_module_rpm.sh dist/el8
          ls -la dist/el8
          test -f dist/el8/perl-NYTProfM-6.15-3.el8.x86_64.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perl-NYTProfM-el8
          path: dist/el8/*.rpm
          if-no-files-found: error

  publish:
    name: Attach RPMs to GitHub Release
    needs: el8-rpm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checkout first: download-artifact after checkout so files are not wiped.
      - name: Checkout notes
        uses: actions/checkout@v4

      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          name: perl-NYTProfM-el8
          path: dist/el8

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Rocky 8 testdrive RPM
          files: dist/el8/*.rpm
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES_v0.2.8.md
